name: CPU instruction benchmarks
on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  callgrind:
    name: Ubuntu26 lavapipe C versus Silk
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
            .cache/webgpu-headers
            .cache/bench/rust-target
          key: benchmarks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'scripts/ci-lock.json', 'bench/rust/Cargo.lock', 'bench/rust/build.rs', 'bench/rust/markers.c') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 scripts/setup-ci
      - name: Install measured profiling prerequisites
        # Versions inspected in Ubuntu resolute main's amd64 Packages index.
        run: sudo apt-get install --yes --no-install-recommends valgrind=1:3.26.0-0ubuntu1 g++=4:15.2.0-5ubuntu1
      - name: Build real C, safe Silk and Rust workloads with client markers
        env:
          BENCH_CALLGRIND: '1'
        run: python3 scripts/bench --build-only
      - name: Measure five checked C and Silk workloads
        run: python3 scripts/ab .cache/bench/c .cache/bench/silk --n 10000 --frames 3 --repeats 3
      - name: Time vector against tiny-skia and compare their images
        run: |
          set -o pipefail
          mkdir -p .cache/bench/ab
          python3 scripts/bench-vector | tee .cache/bench/ab/vector.txt
      - name: Time vector.filter against resvg and compare their images
        run: |
          set -o pipefail
          mkdir -p .cache/bench/ab
          python3 scripts/bench-filters | tee .cache/bench/ab/filters.txt
      - name: Retain instruction counts, binary hashes and allocator call trees
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-callgrind-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/bench/ab
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
